<div #map class="h-[60vh] sm:h-[calc(100vh-64px)]"></div>

<section class="h-[40vh] sm:fixed sm:w-[260px] bg-white sm:rounded sm:top-20 sm:left-10 p-5 overflow-y-auto">
    <h2 class="text-xl font-bold text-black mb-2">Marcadores</h2>

    <div class="flex flex-col gap-2">
        @for (marker of markers(); track marker.id) {

        <div class="form-control" (click)="flyToMarker(marker.mapLibreMarker.getLngLat())" (dblclick)="deleteMarker(marker)">
            <label class="label cursor-pointer">
                <div class="text-wrap label-text text-black text-xs">
                    {{ marker.mapLibreMarker.getLngLat() | json }}
                </div>
                <input 
                    type="radio" 
                    name="radio-10" 
                    class="radio"
                    [style]="{ 'background-color': marker.mapLibreMarker._color}"
                    checked="checked"
                />
            </label>
        </div>
        }
        @empty {
        <div class="flex justify-center items-center bg-blue-100 rounded py-4">
            <p class="text-xs text-secondary">No hay marcadores disponibles</p>
        </div>
        }
    </div>

</section>
